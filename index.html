<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}
header{
  background:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #ddd;
}
.logo{
  font-size:25px;
  font-weight:bold;
  margin-bottom:12px;
}
.search{
  display:flex;
  gap:8px;
}
.search input{
  flex:1;
  padding:12px;
  border:1px solid #ccc;
  border-radius:22px;
  font-size:16px;
}
.search button{
  padding:10px 18px;
  border:0;
  border-radius:22px;
  background:#222;
  color:white;
}
main{
  padding:15px;
}
.video{
  background:white;
  margin-bottom:20px;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 1px 5px #ccc;
}
.video video{
  width:100%;
  display:block;
  background:#000;
}
.info{
  padding:12px;
}
.info h3{
  margin:0 0 6px;
}
.info p{
  margin:0;
  color:#777;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 My Video</div>

  <div class="search">
    <input type="text" id="search" placeholder="ভিডিও খুঁজুন...">
    <button onclick="searchVideo()">Search</button>
  </div>
</header>

<main id="videos">

  <div class="video" data-title="আমার প্রথম ভিডিও">
    <video controls poster="">
      <source src="video1.mp4" type="video/mp4">
      আপনার ব্রাউজার ভিডিও চালাতে পারে না।
    </video>

    <div class="info">
      <h3>আমার প্রথম ভিডিও</h3>
      <p>My Video • নতুন ভিডিও</p>
    </div>
  </div>

</main>

<script>
function searchVideo(){
  let text=document.getElementById("search").value.toLowerCase();
  let videos=document.querySelectorAll(".video");

  videos.forEach(video=>{
    let title=video.dataset.title.toLowerCase();

    if(title.includes(text)){
      video.style.display="block";
    }else{
      video.style.display="none";
    }
  });
}
</script>

</body>
</html>
